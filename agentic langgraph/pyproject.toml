[project]
name = "agentic-langgraph"
version = "0.1.0"
description = "A LangGraph workflow with planning, research, analysis, and report-writing agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-generativeai",
    "grandalf>=0.8",
    "jsonpatch>=1.33",
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    "langchain-google-genai",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.12.1",
    "networkx>=3.6.1",
    "openai>=3.13.0",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "qdrant-client",
    "sentence-transformers",
]

[project.scripts]
agentic-langgraph = "agentic_langgraph.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
